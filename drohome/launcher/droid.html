<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HTMLOS Launcher3 - Android 7.1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
:root{--accent:#009688;--icon:48px;--cols:6;--dock-a:0;--qsw:320px;--fs:1;--ir:0}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:Roboto,"Helvetica Neue",Arial,sans-serif}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000;position:relative}
.material-symbols-outlined{font-size:22px}
button{font:inherit;cursor:pointer}
#launcher{position:absolute;inset:0;background:center/cover no-repeat}
#dim{position:fixed;inset:0;background:#000;opacity:.14;pointer-events:none;z-index:30000}
#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:8px 18px;border-radius:2px;font-size:13px;z-index:30001;display:none}
/* icons */
.ic img,.ic .sym-ico{width:var(--icon);height:var(--icon);border-radius:var(--ir);object-fit:contain;pointer-events:none}
.sym-ico{display:flex;align-items:center;justify-content:center;color:#fff}
.sym-ico .material-symbols-outlined{font-size:calc(var(--icon)*.58)}
.lbl{font-size:calc(11px*var(--fs));color:#fff;margin-top:4px;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:84px;text-align:center;pointer-events:none}
body.nolabel .home-icon-item .lbl{display:none}
/* home */
#home-pager{position:absolute;top:84px;left:0;right:0;bottom:calc(var(--navh,52px) + 72px + 44px);overflow:hidden;z-index:2;touch-action:none}
#home-track{display:flex;height:100%}
.home-page{height:100%;flex-shrink:0;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(var(--rows),1fr);padding:0 16px}
#page-dots{position:absolute;left:0;right:0;bottom:calc(var(--navh,52px) + 72px + 32px);display:flex;justify-content:center;gap:8px;z-index:2;pointer-events:none}
#page-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}#page-dots i.on{background:#fff}
.home-icon-item{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border-radius:8px;touch-action:none}
.home-icon-item.dragging{opacity:.3}
.search-widget{position:absolute;top:32px;left:16px;right:16px;width:auto;height:40px;background:#f5f5f5;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.4);display:flex;align-items:center;gap:10px;padding:0 14px;color:#757575;font-size:15px;z-index:2;cursor:pointer}
#dock{position:absolute;left:0;right:0;bottom:0;height:calc(72px + var(--navh,52px));padding-bottom:var(--navh,52px);display:flex;justify-content:center;align-items:center;gap:22px;background:var(--dock-bg,transparent);z-index:2}
.dock-icon{display:flex;cursor:pointer}.dock-icon:active{transform:scale(.9)}
.drawer-trigger{position:absolute;bottom:calc(var(--navh,52px) + 72px);left:50%;transform:translateX(-50%);color:#fff;z-index:3;cursor:pointer;padding:0 20px}
.drawer-trigger .material-symbols-outlined{font-size:30px;text-shadow:0 1px 2px #000}
#delete-zone{position:absolute;top:28px;left:50%;transform:translate(-50%,-80px);background:rgba(229,57,53,.92);color:#fff;padding:8px 32px;border-radius:20px;display:flex;align-items:center;gap:8px;font-size:14px;z-index:3000;transition:transform .25s;pointer-events:none}
#delete-zone.active{transform:translate(-50%,0)}#delete-zone.hover{background:#b71c1c}
#drag-ghost{position:fixed;pointer-events:none;z-index:99999;display:none;transform:translate(-50%,-50%);opacity:.9}
/* status/nav */
#status-bar{position:fixed;top:0;left:0;width:100%;height:24px;display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:0 12px;color:#fff;font-size:13px;z-index:9999;transition:background-color .25s;cursor:pointer}
#status-bar .material-symbols-outlined{font-size:16px}
#nav-bar{position:fixed;bottom:0;left:0;width:100%;height:var(--navh,52px);display:flex;justify-content:center;align-items:center;gap:72px;z-index:9999;transition:background-color .25s}
#nav-bar.app-active,#nav-bar.navblack{background:#000}
.nav-btn{height:55px;cursor:pointer;opacity:.9;padding:4px}.nav-btn:active{opacity:.5}.nav-btn img{height:100%}
/* QS (Nougat tablet) */
#qs-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10000;display:flex;justify-content:center;align-items:flex-start;padding-top:24px;opacity:0;pointer-events:none;transition:opacity .25s}
#qs-overlay.active{opacity:1;pointer-events:auto}
.qs-card{position:relative;width:var(--qsw);max-width:94vw;max-height:calc(100vh - 56px);overflow-y:auto;background:#fff;border-radius:var(--qs-r,0);box-shadow:0 8px 24px rgba(0,0,0,.5);transform:translateY(-50px);transition:transform .3s cubic-bezier(0,0,.2,1)}
#qs-overlay.active .qs-card{transform:none}
.qs-top{background:var(--qs-bg,#263238);color:#fff}
.qs-head{display:flex;align-items:center;padding:14px 14px 10px;font-size:12px;gap:16px}
.qs-head .sp{flex:1}.qs-head .material-symbols-outlined{font-size:18px;cursor:pointer}
#qs-user-btn{color:#4fc3f7}
.qs-bright{display:flex;padding:8px 18px 4px}.qs-bright input{flex:1;accent-color:var(--qs-on,#fff);height:4px}
#qs-grid{display:grid;grid-template-columns:repeat(var(--qs-cols,3),1fr);padding:6px 10px 12px}
.qs-top.collapsed .qs-bright,.qs-top.collapsed #qs-grid,.qs-top.collapsed #qs-avail{display:none}
.qs-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px;cursor:pointer;color:var(--qs-off,#78909c);background:var(--qs-tile-bg,transparent);border-radius:var(--qs-tile-r,0)}
.qs-tile span:last-of-type{font-size:10px;text-align:center}
.qs-tile.on{color:var(--qs-on,#fff)}
.qs-tile .rm{position:absolute;top:4px;right:10px;background:#e53935;color:#fff;border-radius:50%;width:16px;height:16px;font-size:13px;display:flex;align-items:center;justify-content:center}
#qs-avail{padding:0 14px 12px;font-size:12px;color:#b0bec5;display:none}
#qs-avail.show{display:block}
#qs-avail .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
#qs-avail .chip{background:#37474f;color:#fff;border-radius:14px;padding:5px 10px;cursor:pointer}
.qs-reset{color:#80cbc4;cursor:pointer;font-weight:500}
#qs-users{display:none;position:absolute;top:44px;left:10px;width:230px;background:#fff;color:#212121;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:5;font-size:14px}
#qs-users.show{display:block}
#qs-users div{padding:12px 16px;cursor:pointer;display:flex;gap:10px;align-items:center}
#qs-users div:active{background:#e0e0e0}#qs-users .cur{font-weight:600;color:var(--accent)}
.notif{padding:10px 14px;background:var(--qs-notif,#fff);border-bottom:1px solid #eee;color:#212121}
.notif .h{display:flex;gap:6px;align-items:center;font-size:11px;color:#616161;margin-bottom:4px}.notif .h .material-symbols-outlined{font-size:14px}
.notif b{font-size:13px;display:block}.notif p{font-size:12px;color:#757575;margin-top:2px}
.notif .shot{margin-top:8px;height:70px;background:linear-gradient(#9e9e9e,#cfd8dc);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center}
.notif .acts{margin-top:8px;display:flex;gap:18px;font-size:12px;color:#546e7a;font-weight:600}
.qs-foot{padding:8px 16px;text-align:right;font-size:12px;font-weight:600;color:#546e7a;background:#eceff1;cursor:pointer}
/* drawer */
#app-drawer{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:5000;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .25s}
#app-drawer.active{opacity:1;pointer-events:auto}
.drawer-card{width:80%;max-width:700px;height:84%;background:#f2f2f2;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden;transform:translateY(30px) scale(.95);transition:transform .28s cubic-bezier(0,0,.2,1)}
#app-drawer.active .drawer-card{transform:none}
.d-bar{position:relative;display:flex;justify-content:center;align-items:center;padding:12px 44px;margin:0 10px;border-bottom:1px solid var(--accent);color:var(--accent)}
.d-s{display:flex;align-items:center;gap:6px}.d-s .material-symbols-outlined{font-size:18px}
.d-bar input{width:110px;border:0;outline:0;background:transparent;font-size:13px;font-weight:500;color:var(--accent);transition:width .2s}.d-bar input:focus{width:220px}
.d-bar input::placeholder{color:var(--accent);opacity:.9}.d-add{position:absolute;right:0;cursor:pointer}
.app-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:max-content;gap:16px 8px;padding:18px 14px;overflow-y:auto}
.app-item{display:flex;flex-direction:column;align-items:center;cursor:pointer}.app-item:active{opacity:.7}
.app-item .lbl{color:#424242;text-shadow:none;font-size:11px}
/* apps */
#app-frame-container{position:fixed;inset:0;z-index:4000;display:none;background:#fff}
#app-frame-container.in{animation:aIn .38s cubic-bezier(0,0,.2,1) forwards}
#app-frame-container.out{animation:aOut .28s cubic-bezier(.4,0,1,1) forwards}
@keyframes aIn{from{transform:translateY(100%);opacity:.4}to{transform:none;opacity:1}}
@keyframes aOut{from{transform:none;opacity:1}to{transform:translateY(100%);opacity:.4}}
#app-frame-container[data-anim=fade].in{animation:fIn .3s forwards}
#app-frame-container[data-anim=fade].out,#app-frame-container[data-anim=zoom].out{animation:fOut .25s forwards}
#app-frame-container[data-anim=zoom].in{animation:zIn .3s cubic-bezier(0,0,.2,1) forwards}
#app-frame-container[data-anim=none].in,#app-frame-container[data-anim=none].out{animation:none}
@keyframes fIn{from{opacity:0}to{opacity:1}}@keyframes fOut{to{opacity:0}}
@keyframes zIn{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
#ff-bar{display:none;position:absolute;top:0;left:0;right:0;height:24px;background:#212121;color:#fff;font-size:12px;align-items:center;justify-content:space-between;padding:0 8px;z-index:2;cursor:move;touch-action:none}
#app-frame-container.ff{inset:auto;box-shadow:0 10px 30px rgba(0,0,0,.6);overflow:hidden}
.ff #ff-bar{display:flex}.ff #app-frame,.ff #sys-view{padding:24px 0 0}
.tb{flex-shrink:0;color:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);z-index:2}
.tb-r{display:flex;align-items:center;height:56px;padding:0 16px;gap:24px;font-size:20px;font-weight:500}.tb-r .t{flex:1}.tb-r .material-symbols-outlined{cursor:pointer;font-size:24px}
.tb-tabs{display:flex;overflow-x:auto}.tb-tabs div{padding:14px 20px;font-size:14px;font-weight:500;text-transform:uppercase;opacity:.7;white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer}
.tb-tabs div.on{opacity:1;border-color:#fff}
.pop{position:absolute;right:8px;top:30px;background:#fff;color:#212121;box-shadow:0 4px 14px rgba(0,0,0,.4);min-width:180px;z-index:9}
.pop div{padding:13px 16px;font-size:14px;cursor:pointer}.pop div:active{background:#e0e0e0}
.card{background:#fff;margin:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.3);border-radius:2px;overflow:hidden}
.card .h{padding:14px 16px 2px;font-size:13px;font-weight:700;color:#757575;text-transform:uppercase}
.stat{height:160px;display:flex;align-items:center;justify-content:center}.stat-t{padding:12px 16px;text-align:center;font-weight:700;font-size:14px}
.fw{display:flex;align-items:center;gap:28px;padding:14px 16px;font-size:15px;color:#212121}.fw .material-symbols-outlined{color:#757575;font-size:28px}
#app-frame{width:100%;height:100%;border:0;padding:24px 0 var(--navh,52px)}
#sys-view{position:absolute;inset:0;padding:24px 0 var(--navh,52px);display:none;flex-direction:column;background:#fafafa;color:#212121}
.sbar{height:48px;flex-shrink:0;display:flex;align-items:center;padding:0 16px;color:#fff;font-size:18px;font-weight:500;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.sbody{flex:1;overflow-y:auto}
.sec{padding:14px 16px 6px;font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;border-bottom:1px solid #e0e0e0;background:#fff;font-size:14px}
.row small{display:block;color:#757575;font-size:12px;margin-top:2px}
.row input[type=range]{width:180px;accent-color:var(--accent)}
.row input[type=text],.row input[type=url],.row textarea,.row select{border:0;border-bottom:2px solid var(--accent);outline:0;font-size:14px;padding:4px 0;background:transparent;width:240px}
.row textarea{width:100%;height:90px;border:1px solid #ccc;font-family:monospace;font-size:12px}
.sw{position:relative;width:36px;height:14px;flex-shrink:0}.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:#b0bec5;border-radius:7px;transition:.2s}
.sw i:before{content:"";position:absolute;width:20px;height:20px;left:-2px;top:-3px;background:#eceff1;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:.2s}
.sw input:checked+i{background:color-mix(in srgb,var(--accent) 45%,#fff)}.sw input:checked+i:before{transform:translateX(20px);background:var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatches b{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #bbb}
.mbtn{background:var(--accent);color:#fff;border:0;padding:8px 16px;border-radius:2px;font-size:13px;font-weight:500;text-transform:uppercase;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.mbtn.flat{background:#d6d6d6;color:#212121}
/* recents */
#recents-view{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:8000;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
#recents-view.active{opacity:1;pointer-events:auto}
.recents-empty{color:#fff;font-size:16px}
.recents-stack{position:relative;width:340px;height:380px;display:flex;justify-content:center;align-items:center}
.r-card{position:absolute;width:320px;height:250px;background:#fff;border-radius:4px;box-shadow:0 10px 25px rgba(0,0,0,.5);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.r-head{height:38px;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px;font-weight:500}
.r-head div{display:flex;gap:8px;align-items:center}.r-head .ic{display:flex;--icon:22px}
.r-body{flex:1;background:#fafafa;display:flex;align-items:center;justify-content:center;color:#bdbdbd}
/* dialog */
.dlg-o{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20000;display:flex;align-items:center;justify-content:center}
.dlg{background:#ededed;width:88%;max-width:420px;max-height:92vh;overflow-y:auto;padding:20px 22px 12px;box-shadow:0 11px 15px -7px rgba(0,0,0,.2),0 24px 38px 3px rgba(0,0,0,.14);color:#212121}
.dlg h3{font-size:19px;font-weight:500;margin-bottom:14px}.dlg-b{font-size:14px;margin-bottom:12px}
.dlg-a{display:flex;justify-content:flex-end;gap:4px}
.dlg-a button,.wz-n button{background:0;border:0;color:var(--accent);font-size:13px;font-weight:600;padding:8px 10px;text-transform:uppercase}
.dlg label{display:flex;gap:10px;align-items:center;padding:8px 0}
.dlg input[type=text],.dlg input[type=url]{width:100%;border:0;border-bottom:2px solid var(--accent);background:transparent;outline:0;padding:6px 0;font-size:15px;margin:6px 0}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.pick div{height:42px;border-radius:6px;background:#cfd8dc;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid transparent}
.pick div.sel{border-color:var(--accent);background:#b2dfdb}
.wz-n{display:flex;justify-content:flex-end;margin-top:8px}
.dui{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;background:#fafafa;color:#212121}
.dui-tb{height:56px;background:#263238;color:#fff;display:flex;align-items:center;padding:0 16px;gap:20px;flex-shrink:0;box-shadow:0 2px 4px rgba(0,0,0,.4);z-index:2}
.dui-tb .t{font-size:18px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dui-tb .material-symbols-outlined{cursor:pointer;font-size:24px}
.dui-tb button{background:0;border:0;color:#80cbc4;font-weight:600;font-size:14px}
.dui-sr{display:flex;align-items:center;gap:6px;background:#6b7378;height:40px;padding:0 8px;width:260px;max-width:50%}
.dui-sr input{flex:1;min-width:0;background:0;border:0;outline:0;color:#fff;font-size:16px;user-select:text;-webkit-user-select:text}
.dui-sr input::placeholder{color:#cfd8dc}
.dui-body{flex:1;display:flex;min-height:0}
.dui-side{width:190px;background:#eee;flex-shrink:0;overflow-y:auto;padding-top:6px}
.dui-side hr{border:0;border-top:1px solid #d0d0d0;margin:8px 0}
.dui-sd{display:flex;align-items:center;gap:20px;height:52px;padding:0 20px;font-size:15px;cursor:pointer}.dui-sd .material-symbols-outlined{color:#757575}.dui-sd.on{background:#e0e0e0}
.dui-main{flex:1;overflow-y:auto;background:#fafafa}
.dui-it{display:flex;align-items:center;gap:20px;padding:0 24px;height:56px;cursor:pointer;font-size:15px}.dui-it:active{background:#e0e0e0}
.dui-it .ic,.dui-gc .ic{color:#607d8b}.dui-it.sel,.dui-gc.sel{background:#b2dfdb}.dui-it.dis,.dui-gc.dis{opacity:.4;pointer-events:none}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{display:block;font-size:11px;color:#757575}
.dui-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;padding:12px}
.dui-gc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100px;padding:6px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);border-radius:3px;cursor:pointer;font-size:12px;text-align:center}
.dui-gc .nm{max-width:100%;flex:none}
.dui .pop{top:50px}
.dui-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:15000;display:flex;align-items:center;justify-content:center}
.dui-box{width:min(860px,94vw);height:min(420px,86vh);display:flex;flex-direction:column;box-shadow:0 12px 32px rgba(0,0,0,.6);overflow:hidden}
.dui-pk{max-height:220px;overflow:auto}.dui-pk .r{display:flex;gap:12px;align-items:center;padding:10px 4px;cursor:pointer}.dui-pk .r:active{background:#d6d6d6}
.dui-ta{width:100%;height:200px;font-family:monospace;font-size:12px;border:1px solid #bbb;padding:6px;background:#fff;resize:none;user-select:text;-webkit-user-select:text}
.dlg input[type=text],.dlg textarea{user-select:text;-webkit-user-select:text}
@media(max-width:600px){.dui-side{width:56px}.dui-side .lb{display:none}.dui-sd{padding:0 16px}}
#recents-ext{max-width:100%}
.r-row{display:flex;gap:14px;overflow-x:auto;max-width:96vw;padding:10px 16px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.r-fcard{flex:0 0 200px;height:140px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden;cursor:pointer;scroll-snap-align:center}
.r-fh{height:34px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 8px;color:#fff;font-size:12px;font-weight:500}
.r-fh .ic{display:flex;--icon:20px}.r-fh .t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.r-fh .material-symbols-outlined{font-size:18px;cursor:pointer}
.r-fb{flex:1;background:#fafafa;display:flex;align-items:center;justify-content:center}.r-fb .ic{display:flex;--icon:48px;opacity:.5}
#recents-view.has-ext .recents-stack{height:210px}#recents-view.has-ext .r-card{height:170px}
</style>
</head>
<body>
<div id="launcher">
  <div id="delete-zone"><span class="material-symbols-outlined">delete</span><span>削除</span></div>
  <div id="status-bar" onclick="openQS()">
    <span class="material-symbols-outlined">signal_wifi_4_bar</span><span class="material-symbols-outlined">network_cell</span><span class="material-symbols-outlined">battery_full</span><span id="clock">00:00</span>
  </div>
  <div class="search-widget" onclick="launch('searchbox.html')"><span class="material-symbols-outlined">search</span>検索</div>

 {id:'ff7',name:'Freeform Window (Android 7)',desc:'アプリをフローティングウィンドウ化。履歴画面の上段にウィンドウ一覧を表示',enabled:true,code:M(L=>{
  const wins=[];let zc=0,cn=0;
  const mk=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
  L.addCSS(`.ffw{position:fixed;z-index:4500;display:flex;flex-direction:column;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.55);overflow:hidden;min-width:220px;min-height:160px}
.ffw .h{height:32px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 4px 0 8px;color:#fff;font-size:12px;font-weight:500;touch-action:none;cursor:move}

.ffw .b{flex:1;position:relative;display:flex;flex-direction:column;min-height:0;background:#fafafa;color:#212121}
.ffw iframe{flex:1;border:0;width:100%;background:#fff}
.ffw .rz{position:absolute;right:0;bottom:0;width:24px;height:24px;touch-action:none;cursor:nwse-resize;z-index:3}
.ffw .sh{position:absolute;left:0;right:0;top:32px;bottom:0;z-index:2;display:none}.ffw:not(.top) .sh{display:block}`);
  const front=w=>{w.el.style.zIndex=4500+(++zc%400);wins.forEach(x=>x.el.classList.toggle('top',x===w))};
  const close=w=>{w.el.remove();const i=wins.indexOf(w);if(i>=0)wins.splice(i,1)};
  const maxi=w=>{const id=w.id;close(w);launch(id)};
  function wire(w){
   const e=w.el,h=e.querySelector('.h'),rz=e.querySelector('.rz');let d=null,s=null;
   e.addEventListener('pointerdown',()=>front(w),true);
   h.onpointerdown=ev=>{if(ev.target.dataset.a)return;h.setPointerCapture(ev.pointerId);const r=e.getBoundingClientRect();d={x:ev.clientX-r.left,y:ev.clientY-r.top}};
   h.onpointermove=ev=>{if(!d)return;e.style.left=Math.min(Math.max(ev.clientX-d.x,80-e.offsetWidth),innerWidth-80)+'px';e.style.top=Math.min(Math.max(ev.clientY-d.y,24),innerHeight-60)+'px'};
   h.onpointerup=()=>d=null;
   h.onclick=ev=>{const a=ev.target.dataset.a;if(a==='x')close(w);if(a==='max')maxi(w)};
   rz.onpointerdown=ev=>{rz.setPointerCapture(ev.pointerId);const r=e.getBoundingClientRect();s={w:r.width-ev.clientX,h:r.height-ev.clientY}};
   rz.onpointermove=ev=>{if(!s)return;e.style.width=Math.max(220,ev.clientX+s.w)+'px';e.style.height=Math.max(160,ev.clientY+s.h)+'px'};
   rz.onpointerup=()=>s=null;
  }
  function open(id){
   const a=find(id);if(!a)return;
   let w=wins.find(x=>x.id===id);if(w){front(w);return w}
   const e=mk('div','ffw'),i=cn++%5,W=Math.min(Math.round(innerWidth*.6),460),H=Math.min(Math.round(innerHeight*.58),300);
   e.style.cssText=`left:${40+i*28}px;top:${40+i*28}px;width:${W}px;height:${H}px`;
   e.innerHTML=`<div class="h" style="background:${a.bar||a.color||'#37474f'}"><span class="ic">${ico(a)}</span><span class="t"></span><span class="material-symbols-outlined" data-a="max" title="全画面">crop_square</span><span class="material-symbols-outlined" data-a="x" title="閉じる">close</span></div><div class="b"></div><div class="rz"></div><div class="sh"></div>`;
   e.querySelector('.t').textContent=a.name;

   document.body.appendChild(e);

  L.recents.addAction({icon:'picture_in_picture_alt',title:'フローティング',fn:id=>{const top=isAppOpen&&tasks[0]===id;open(id);closeRecents();if(top)handleHome()}});
  L.appMenu.add({label:'フローティングで開く',icon:'picture_in_picture_alt',fn:a=>open(a.id)});
  L.recents.addSection(c=>{
   if(!wins.length)return false;
   const row=mk('div','r-row');row.onwheel=e=>{row.scrollLeft+=e.deltaY};
   wins.forEach(w=>{

    row.appendChild(card)});
   c.appendChild(row);
  });
  L.onUnload(()=>wins.slice().forEach(close));
 })},
 {id:'fontmgr',name:'Font Manager (GUI)',desc:'/system/fonts の ttf を適用（同一オリジンの iframe アプリにも反映）',enabled:true,code:M(L=>{
  let cur=null,css='',sty=null;
  const EXT=/\.(ttf|otf|woff2?)$/i;
  const fcss=d=>"@font-face{font-family:'HTMLOSFont';src:url("+d+")}*:not([class*='material']){font-family:'HTMLOSFont',Roboto,Arial,sans-serif!important}";
  const inject=f=>{try{const a=f._fa;if(a&&a.type==='url')return;const d=f.contentDocument;if(!d||!d.head)return;let s=d.getElementById('htmlos-font');
   if(!css){if(s)s.remove();return}if(!s){s=d.createElement('style');s.id='htmlos-font';d.head.appendChild(s)}s.textContent=css}catch(e){}};
  const applyAll=()=>{if(sty){sty.remove();sty=null}if(css)sty=L.addCSS(css);inject(L.window.frame())};
  const setFont=async p=>{
   if(!p){css='';cur=null}else{const b=await L.fs.read(p);if(!b){L.toast('読み込めません');return}css=fcss(await L.readFile(b));cur=p}
   L.store.set('font',cur);applyAll();
  };
  L.store.get('font').then(p=>{if(p)setFont(p)});
  L.on('frame',({iframe,app})=>{iframe._fa=app;if(!iframe._fm){iframe._fm=1;iframe.addEventListener('load',()=>inject(iframe))}});
  L.onUnload(()=>{css='';inject(L.window.frame())});
  L.app({name:'Font Manager',sym:'font_download',color:'#6a1b9a',open(root,UI){
   const t=UI.topbar(root,'Font Manager',{color:'#6a1b9a',nav:'back',menu:[{t:'更新',fn:()=>draw()}]});
   const b=t.body;let sel=cur;
   const draw=()=>{
    b.innerHTML='';b.append(UI.section('/system/fonts'));
    const fonts=L.fs.ls('/system/fonts').filter(p=>EXT.test(p)).sort();
    if(!fonts.length)b.append(UI.row('フォントがありません','ファイルアプリで /system/fonts に ttf を置いてください'));
    fonts.forEach(p=>{
     const r=UI.row(L.fs.base(p),cur===p?'適用中':null,'<span class="material-symbols-outlined" style="color:'+(sel===p?'#6a1b9a':'#9e9e9e')+'">'+(sel===p?'radio_button_checked':'radio_button_unchecked')+'</span>');
     r.style.cursor='pointer';r.onclick=()=>{sel=p;draw()};b.append(r)});
    const w=document.createElement('div');w.style.cssText='padding:16px;display:flex;gap:10px';
    w.append(UI.button('適用',async()=>{if(!sel)return L.toast('フォントを選択してください');await setFont(sel);L.toast('フォントを適用しました');draw()}),
     UI.button('標準に戻す',async()=>{sel=null;await setFont(null);draw()},true));
    b.append(w,UI.row('現在のフォント',cur?L.fs.base(cur):'標準'));
   };
   draw();

function addToHome(id){
 const used=new Set(homeApps.map(h=>h.p+','+h.c+','+h.r));
 for(let p=curPage;;p++)for(let r=0;r<S.rows;r++)for(let c=0;c<S.cols;c++)if(!used.has(p+','+c+','+r)){homeApps.push({id,p,c,r});renderHome();save();return}
}
function relayoutHome(){

 homeApps=L.map((h,i)=>({id:h.id,p:Math.floor(i/per),c:i%S.cols,r:Math.floor(i/S.cols)%S.rows}));save();
}
function clampHome(){if(homeApps.some(h=>h.c>=S.cols||h.r>=S.rows))relayoutHome();renderHome()}
function renderHome(){
 homeApps=homeApps.filter(h=>find(h.id));
 const track=$('#home-track'),n=Math.max(pgCount(),curPage+1);
 track.innerHTML='';track.style.width=n*100+'%';
 for(let p=0;p<n;p++){
  const pg=el('div','home-page');pg.style.width=(100/n)+'%';
  homeApps.filter(h=>h.p===p).forEach(h=>{
   const a=find(h.id),d=el('div','home-icon-item');d.style.gridColumn=h.c+1;d.style.gridRow=h.r+1;
   d.innerHTML=`<div class="ic">${ico(a)}</div><span class="lbl">${esc(a.name)}</span>`;d._h=h;
   d.onclick=()=>{if(swiped)return;launch(h.id)};pg.appendChild(d)});
  track.appendChild(pg)}

function goPage(i,anim=true){
 const t=$('#home-track'),n=t.children.length;curPage=Math.max(0,Math.min(i,n-1));
 t.style.transition=anim?'transform .25s cubic-bezier(0,0,.2,1)':'none';
 t.style.transform=`translateX(${-curPage*100/n}%)`;
 $$('#page-dots i').forEach((d,j)=>d.classList.toggle('on',j===curPage));
}
function stepPage(d){

 if(d>0&&curPage>=n-1){curPage++;renderHome()}else goPage(curPage+d);

function initPager(){
 const pg=$('#home-pager'),dz=$('#delete-zone'),gh=$('#drag-ghost');let st=null,edgeT=null;
 const hit=(r,x,y)=>x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
 pg.addEventListener('pointerdown',e=>{
  if(e.button>0)return;const item=e.target.closest('.home-icon-item');
  st={x:e.clientX,y:e.clientY,cx:e.clientX,cy:e.clientY,item,mode:null};
  if(item)st.t=setTimeout(()=>{if(st&&!st.mode){st.mode='drag';swiped=true;item.classList.add('dragging');dz.classList.add('active');
   gh.innerHTML=item.querySelector('.ic').innerHTML;gh.style.display='flex';gh.style.left=st.cx+'px';gh.style.top=st.cy+'px'}},400);
 });
 window.addEventListener('pointermove',e=>{
  if(!st)return;st.cx=e.clientX;st.cy=e.clientY;const dx=e.clientX-st.x,dy=e.clientY-st.y;
  if(!st.mode&&(Math.abs(dx)>10||Math.abs(dy)>10)){clearTimeout(st.t);st.mode=Math.abs(dx)>Math.abs(dy)?'swipe':'none';if(st.mode==='swipe')swiped=true}
  if(st.mode==='swipe'){const t=$('#home-track'),w=pg.clientWidth,n=t.children.length;t.style.transition='none';
   t.style.transform=`translateX(${Math.max(Math.min(-curPage*w+dx,w*.25),-(n-1)*w-w*.25)}px)`}
  if(st.mode==='drag'){gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px';dz.classList.toggle('hover',hit(dz.getBoundingClientRect(),e.clientX,e.clientY));
   const r=pg.getBoundingClientRect(),edge=e.clientX<r.left+28?-1:e.clientX>r.right-28?1:0;
   if(edge&&!edgeT)edgeT=setTimeout(()=>{edgeT=null;stepPage(edge)},600);else if(!edge&&edgeT){clearTimeout(edgeT);edgeT=null}}
 });
 const end=e=>{
  if(!st)return;const s=st;st=null;clearTimeout(s.t);clearTimeout(edgeT);edgeT=null;
  const inDz=s.mode==='drag'&&hit(dz.getBoundingClientRect(),e.clientX,e.clientY);
  dz.classList.remove('active','hover');gh.style.display='none';
  if(s.mode==='swipe'){const dx=e.clientX-s.x;goPage(Math.abs(dx)>50?curPage+(dx<0?1:-1):curPage)}
  if(s.mode==='drag'){
   const h=s.item._h;
   if(inDz)homeApps=homeApps.filter(i=>i!==h);
   else{const r=pg.getBoundingClientRect(),cw=(r.width-32)/S.cols,ch=r.height/S.rows;
    const c=Math.max(0,Math.min(S.cols-1,Math.floor((e.clientX-r.left-16)/cw))),rr=Math.max(0,Math.min(S.rows-1,Math.floor((e.clientY-r.top)/ch)));
    const o=homeApps.find(i=>i!==h&&i.p===curPage&&i.c===c&&i.r===rr);
    if(o){o.p=h.p;o.c=h.c;o.r=h.r}
    h.p=curPage;h.c=c;h.r=rr}
   save();renderHome()}
  setTimeout(()=>swiped=false,80);
 };
 window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
}
