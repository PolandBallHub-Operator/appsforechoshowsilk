<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Android 7.1 Lockscreen</title>
    
    <!-- Google Fonts: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Google Material Symbols CDN -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
            background-color: #000;
        }

        /* Screen wallpaper container */
        .lockscreen {
            width: 100vw;
            height: 100vh;
            background-image: url('https://raw.githubusercontent.com/PolandBallHub-Operator/appsforechoshowsilk/refs/heads/main/drohome/launcher/wallp.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Top Status Bar */
        .status-bar {
            width: 100%;
            height: 28px;
            padding: 0 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            font-size: 13px;
            font-weight: 400;
            z-index: 10;
        }

        .status-bar-left {
            display: flex;
            align-items: center;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
            letter-spacing: 0.2px;
        }

        .status-bar-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-icon {
            font-size: 16px;
            color: #ffffff;
        }

        /* Custom User Avatar in Status Bar */
        .user-avatar {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #00bcd4;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 2px;
        }

        .user-avatar .material-symbols-outlined {
            font-size: 14px;
            color: #ffffff;
        }

        /* Main Clock & Date Container */
        .clock-container {
            margin-top: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .clock-time {
            font-size: 92px;
            font-weight: 100;
            color: #ffffff;
            line-height: 1;
            letter-spacing: -2px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .clock-date {
            margin-top: 14px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: 1.8px;
            text-transform: uppercase;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        /* Notifications Section */
        .notification-container {
            width: 100%;
            padding: 0 12px;
            margin-top: 32px;
            display: flex;
            justify-content: center;
        }

        .notification-card {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            border-radius: 2px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
        }

        .notification-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
        }

        .notification-app-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notification-app-name {
            font-size: 12px;
            color: #616161;
            font-weight: 400;
        }

        .notification-dot {
            font-size: 12px;
            color: #616161;
        }

        .notification-time {
            font-size: 12px;
            color: #616161;
            font-weight: 400;
        }

        .notification-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notification-text-content {
            display: flex;
            flex-direction: column;
        }

        .notification-title {
            font-size: 15px;
            font-weight: 500;
            color: #212121;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .notification-subtitle {
            font-size: 13px;
            color: #757575;
            font-weight: 400;
        }

        /* Large Neko Cat Avatar Icon */
        .neko-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #dedede;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Bottom Shortcuts Bar */
        .bottom-bar {
            width: 100%;
            padding: 0 32px 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
        }

        .bottom-icon {
            font-size: 24px;
            color: #ffffff;
            opacity: 0.85;
            cursor: pointer;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        .bottom-icon.fingerprint {
            font-size: 32px;
            opacity: 0.9;
        }

        /* Swipe unlock transform styles */
        .lockscreen {
            will-change: transform, opacity;
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.3s ease-out;
            touch-action: none;
        }

        .lockscreen.unlocking {
            transform: translateY(-100vh) !important;
            opacity: 0.2;
        }

        /* Swipe helper indicator */
        .swipe-hint {
            position: absolute;
            bottom: 64px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none;
            animation: pulseHint 2s infinite;
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.3; transform: translate(-50%, 0); }
            50% { opacity: 0.8; transform: translate(-50%, -6px); }
        }
    </style>
</head>
<body>
    <div class="lockscreen" id="lockscreen">
        <!-- Top Status Bar -->
        <div class="status-bar">
            <div class="status-bar-left">
                Fi Network
            </div>
            <div class="status-bar-right">
                <span class="material-symbols-outlined status-icon">wifi</span>
                <span class="material-symbols-outlined status-icon">signal_cellular_4_bar</span>
                <span class="material-symbols-outlined status-icon">battery_full</span>
                <div class="user-avatar">
                    <span class="material-symbols-outlined">person</span>
                </div>
            </div>
        </div>

        <!-- Center Clock & Notification Content -->
        <div class="center-content">
            <div class="clock-container">
                <div class="clock-time" id="clock-time">16:55</div>
                <div class="clock-date" id="clock-date">MONDAY, JULY 18</div>
            </div>

            <!-- Notification Card -->
            <div class="notification-container">
                <div class="notification-card">
                    <div class="notification-header">
                        <!-- Small Cat Icon SVG -->
                        <div class="notification-app-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="#616161">
                                <path d="M12,15.5 A2.5,2.5 0 0,0 14.5,13 A2.5,2.5 0 0,0 12,10.5 A2.5,2.5 0 0,0 9.5,13 A2.5,2.5 0 0,0 12,15.5 M4.5,4.5 L8.5,8.5 L15.5,8.5 L19.5,4.5 L19.5,10.5 C20.5,12 20.5,15 19.5,17 C18.5,19 15.5,20 12,20 C8.5,20 5.5,19 4.5,17 C3.5,15 3.5,12 4.5,10.5 Z"/>
                            </svg>
                        </div>
                        <span class="notification-app-name">Android Neko</span>
                        <span class="notification-dot">•</span>
                        <span class="notification-time">3m</span>
                    </div>
                    <div class="notification-body">
                        <div class="notification-text-content">
                            <span class="notification-title">A cat is here.</span>
                            <span class="notification-subtitle">Cat #731</span>
                        </div>
                        <!-- Right Cat Figure Avatar -->
                        <div class="neko-avatar">
                            <svg width="30" height="30" viewBox="0 0 40 40">
                                <!-- Cat silhouette graphic -->
                                <path d="M11 14 L15 20 L25 20 L29 14 L29 23 C30 25 29 28 27 30 C25 32 22 32 20 32 C18 32 15 32 13 30 C11 28 10 25 11 23 Z" fill="#ffffff" />
                                <!-- Tail -->
                                <path d="M28 28 C32 28 32 22 30 20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                                <!-- Face (:3) -->
                                <circle cx="17" cy="22" r="1" fill="#616161"/>
                                <circle cx="23" cy="22" r="1" fill="#616161"/>
                                <path d="M18.5 24 C19 25 20 25 20 24 C20 25 21 25 21.5 24" stroke="#616161" stroke-width="1" stroke-linecap="round" fill="none"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Action Bar -->
        <div class="bottom-bar">
            <span class="material-symbols-outlined bottom-icon">keyboard_voice</span>
            <span class="material-symbols-outlined bottom-icon fingerprint">fingerprint</span>
            <span class="material-symbols-outlined bottom-icon">photo_camera</span>
        </div>

        <div class="swipe-hint">Swipe up to unlock</div>
    </div>

    <script>
        /* Real-time Clock Implementation */
        function updateClock() {
            const now = new Date();
            
            // Format time HH:MM
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock-time').textContent = `${hours}:${minutes}`;

            // Format date: MONDAY, JULY 18
            const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
            const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
            
            const dayName = days[now.getDay()];
            const monthName = months[now.getMonth()];
            const dayNum = now.getDate();

            document.getElementById('clock-date').textContent = `${dayName}, ${monthName} ${dayNum}`;
        }

        // Initialize clock and update every second
        updateClock();
        setInterval(updateClock, 1000);

        /* Swipe Up to Unlock Gesture Logic */
        const lockscreen = document.getElementById('lockscreen');
        const LAUNCHER_URL = 'https://polandballhub-operator.github.io/appsforechoshowsilk/drohome/launcher3';

        let startY = 0;
        let currentY = 0;
        let isDragging = false;

        function onStart(clientY) {
            startY = clientY;
            currentY = clientY;
            isDragging = true;
            lockscreen.style.transition = 'none';
        }

        function onMove(clientY) {
            if (!isDragging) return;
            currentY = clientY;
            const deltaY = currentY - startY;

            // Only track upwards dragging
            if (deltaY < 0) {
                lockscreen.style.transform = `translateY(${deltaY}px)`;
                lockscreen.style.opacity = `${1 + deltaY / (window.innerHeight * 1.2)}`;
            }
        }

        function onEnd() {
            if (!isDragging) return;
            isDragging = false;
            const deltaY = currentY - startY;

            // Unlock threshold (120px swipe up)
            if (deltaY < -120) {
                unlockScreen();
            } else {
                // Reset screen position
                lockscreen.style.transition = 'transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.3s ease-out';
                lockscreen.style.transform = 'translateY(0)';
                lockscreen.style.opacity = '1';
            }
        }

        function unlockScreen() {
            lockscreen.style.transition = 'transform 0.3s ease-in, opacity 0.3s ease-in';
            lockscreen.classList.add('unlocking');

            // Navigate to specified target URL in the same tab after animation
            setTimeout(() => {
                window.location.href = LAUNCHER_URL;
            }, 280);
        }

        // Touch event listeners
        window.addEventListener('touchstart', (e) => onStart(e.touches[0].clientY), { passive: true });
        window.addEventListener('touchmove', (e) => onMove(e.touches[0].clientY), { passive: true });
        window.addEventListener('touchend', onEnd);

        // Mouse event listeners (for desktop preview testing)
        window.addEventListener('mousedown', (e) => onStart(e.clientY));
        window.addEventListener('mousemove', (e) => onMove(e.clientY));
        window.addEventListener('mouseup', onEnd);
    </script>
</body>
</html>
